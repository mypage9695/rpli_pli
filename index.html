    .header p { margin: 4px 0 0; font-size: 13px; opacity: 0.9; }

    .scheme-toggle { display: flex; justify-content: center; gap: 24px; padding: 14px; background: #fff1f2; border-bottom: 1px solid #fecaca; }
    .scheme-toggle label { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; color: #991b1b; cursor: pointer; }
    .scheme-toggle input[type="radio"] { accent-color: #b91c1c; width: 16px; height: 16px; margin: 0; }

    .form-section { padding: 16px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; display: flex; flex-wrap: nowrap; gap: 8px; }
    .form-group { flex: 1 1 0; min-width: 0; margin-bottom: 0; }
    .form-group label { display: block; font-weight: 600; font-size: 11px; margin-bottom: 6px; color: #334155; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    select { width: 100%; padding: 8px 6px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 13px; background: #fff; color: #0f172a; outline: none; }
    select:focus { border-color: #b91c1c; }

    .table-section { padding: 16px; overflow-x: auto; }
    .table-title { font-size: 14px; font-weight: 700; margin-bottom: 12px; color: #1e293b; text-align: center; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: center; }
    th { background: #fee2e2; color: #991b1b; padding: 10px 8px; border: 1px solid #fecaca; }
    td { padding: 9px 8px; border: 1px solid #e2e8f0; }
    tr:nth-child(even) { background-color: #f8fafc; }
    tr:hover { background-color: #f1f5f9; }
    .highlight-prem { color: #b91c1c; font-weight: 700; }
    .highlight-mat { color: #15803d; font-weight: 700; }

    .disclaimer { font-size: 11px; color: #64748b; margin: 0 16px 16px; line-height: 1.4; text-align: center; }
  </style>
</head>

<div class="container">

    <label>

  </div>

    </div>

    <div class="form-group">

  function getSelectedScheme() {
    return document.querySelector('input[name="scheme"]:checked').value;
  }

  function formatRupees(num) {
    return '₹' + Number(Math.ceil(num)).toLocaleString('en-IN');
  }

  function initAgeDropdown() {
    const select = document.getElementById('entryAge');
    const prevAge = select.value ? parseInt(select.value, 10) : 30;
    select.innerHTML = '';
    for (let age = 19; age <= 55; age++) {
      const opt = document.createElement('option');
      opt.value = age;
      opt.textContent = `${age} Yrs`;
      if (age === prevAge) opt.selected = true;
      select.appendChild(opt);
    }
  }

  function populateSumAssuredDropdown(schemeKey) {
    const select = document.getElementById('sumAssured');
    const prevVal = parseInt(select.value, 10);
    select.innerHTML = '';
    
    const config = schemeConfig[schemeKey];
    config.sumOptions.forEach(item => {
      const opt = document.createElement('option');
      opt.value = item.val;
      opt.textContent = item.label;
      if (prevVal ? item.val === prevVal : item.selected) {
        opt.selected = true;
      }
      select.appendChild(opt);
    });

    if (!select.value && select.options.length > 0) {
      select.selectedIndex = 0;
    }
  }

  function onSchemeChange() {
    const schemeKey = getSelectedScheme();
    const config = schemeConfig[schemeKey];

    document.getElementById('portalHeading').innerText = config.name;
    document.getElementById('portalSubheading').innerText = config.plan;
    document.getElementById('footerDisclaimer').innerHTML = config.disclaimer;

    populateSumAssuredDropdown(schemeKey);
    renderTable();
  }

  function renderTable() {
    const schemeKey = getSelectedScheme();
    const config = schemeConfig[schemeKey];
    const entryAge = parseInt(document.getElementById('entryAge').value, 10);
    const sumAssured = parseInt(document.getElementById('sumAssured').value, 10);
    const frequency = document.getElementById('frequency').value;

    document.getElementById('premHeaderLabel').innerText = 
      frequency.charAt(0).toUpperCase() + frequency.slice(1) + ' Premium';

    document.getElementById('tableHeader').innerText = 
      `${schemeKey} - ${config.plan} (Age: ${entryAge} | SA: ${formatRupees(sumAssured)})`;

    const tbody = document.getElementById('plansTableBody');
    tbody.innerHTML = '';

    const rateTable = config.rates[frequency] || {};
    const ageRates = rateTable[entryAge];

    if (!ageRates) {
      tbody.innerHTML = `<tr><td colspan="4" style="color: #b91c1c; padding: 20px;">No plan entries available for age ${entryAge}</td></tr>`;
      return;
    }

    maturityAges.forEach(mAge => {
      if (mAge > entryAge && ageRates[mAge] !== undefined) {
        const term = mAge - entryAge;
        const ratePerUnit = ageRates[mAge];
        
        const premium = Math.ceil((sumAssured / config.baseUnit) * ratePerUnit);
        const totalBonus = (sumAssured / 1000) * config.annualBonusPerThousand * term;
        const estimatedMaturity = sumAssured + totalBonus;

        const row = document.createElement('tr');
        row.innerHTML = `
          <td><strong>${mAge} Yrs</strong></td>
          <td>${term} Yrs</td>
          <td class="highlight-prem">${formatRupees(premium)}</td>
          <td class="highlight-mat">${formatRupees(estimatedMaturity)}</td>
        `;
        tbody.appendChild(row);
      }
    });
  }

  window.onload = function() {
    initAgeDropdown();
    onSchemeChange();
  };
